# Build and tests on three OSes and two Node.js versions.
# The tests also extract archives written by af-backup with external tools (tar, Python tarfile, gzip -t).
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          AF_BACKUP_TEST_DIR: ${{ runner.temp }}/af-backup-tests
      - name: Crash torture (short)
        run: node scripts/crash-torture.ts "${{ runner.temp }}/af-backup-torture" --iterations=15
